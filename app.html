<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Year?</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:#101418; color:#e8eef4; min-height:100vh; padding:18px 12px 50px; }
  .wrap { max-width:560px; margin:0 auto; }
  header { text-align:center; margin-bottom:12px; }
  header h1 { font-size:26px; }
  header .tag { color:#7d94a8; font-size:12px; }
  a { color:#5ec1e8; text-decoration:none; }
  .hud { display:flex; justify-content:center; gap:26px; margin-bottom:12px; font-variant-numeric:tabular-nums; }
  .hud .c { text-align:center; }
  .hud .v { font-size:21px; font-weight:800; }
  .hud .k { font-size:10px; color:#7d94a8; text-transform:uppercase; letter-spacing:1px; }
  .card { background:#18222c; border:1px solid #24394c; border-radius:16px; padding:22px; text-align:center; }
  .cat { display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#5ec1e8; background:#0f2a3a; border:1px solid #1c4a63; border-radius:999px; padding:4px 12px; margin-bottom:14px; }
  #eventText { font-size:19px; line-height:1.5; min-height:58px; font-weight:600; }
  .sliderWrap { margin:20px 0 6px; }
  input[type=range] { width:100%; accent-color:#5ec1e8; }
  #guessYear { font-size:34px; font-weight:800; color:#5ec1e8; font-variant-numeric:tabular-nums; }
  .btn { background:#5ec1e8; color:#101418; border:none; border-radius:999px; padding:12px 34px; font-size:15px; font-weight:800; cursor:pointer; margin-top:10px; }
  .btn.ghost { background:#24394c; color:#bcd4e6; }
  #verdict { min-height:70px; margin-top:14px; font-size:14.5px; line-height:1.6; }
  #verdict .pts { font-size:24px; font-weight:800; display:block; }
  #final { display:none; }
  #final .grade { font-size:30px; font-weight:800; color:#ffd166; margin:8px 0; }
  .best { color:#7d94a8; font-size:11.5px; text-align:center; margin-top:12px; }
  .note { text-align:center; color:#4d6375; font-size:11.5px; margin-top:14px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>&#8987; What Year?</h1><div class="tag">read the event, slide to the year, sweat the reveal.</div></header>
  <div class="hud">
    <div class="c"><div class="v" id="round">1</div><div class="k">round / <span id="rounds">10</span></div></div>
    <div class="c"><div class="v" id="total">0</div><div class="k">points</div></div>
  </div>
  <div class="card" id="play">
    <div class="cat" id="cat">history</div>
    <div id="eventText"></div>
    <div class="sliderWrap">
      <input type="range" id="slider" min="1400" max="2025" value="1900">
      <div id="guessYear">1900</div>
    </div>
    <button class="btn" id="guessBtn">Lock it in</button>
    <div id="verdict"></div>
  </div>
  <div class="card" id="final">
    <div style="font-size:15px;color:#7d94a8">final score</div>
    <div class="grade" id="finalScore"></div>
    <div id="finalGrade" style="font-size:17px;font-weight:700;margin-bottom:6px"></div>
    <div id="finalBest" style="font-size:12.5px;color:#7d94a8"></div>
    <button class="btn" id="again">Play again</button>
  </div>
  <div class="best" id="best"></div>
  <div class="note">Exact year scores 125. Every year off costs a point.<br><a href="index.html">about</a></div>
</div>
<script src="engine.js?v=1"></script>
<script>
var ROUNDS=10, BEST_KEY='whatyear-best-v1';
var S={order:[],round:0,total:0,locked:false,cur:null};
function $(id){return document.getElementById(id);}
function best(){ try{return +localStorage.getItem(BEST_KEY)||0;}catch(_){return 0;} }
function saveBest(v){ try{localStorage.setItem(BEST_KEY,v);}catch(_){}}
function newRun(){
  S.order=pickRound(EVENTS,ROUNDS);
  S.round=0; S.total=0;
  $('final').style.display='none';
  $('play').style.display='block';
  $('total').textContent='0';
  nextEvent();
  renderBest();
}
function nextEvent(){
  S.cur=EVENTS[S.order[S.round]];
  S.locked=false;
  $('round').textContent=S.round+1;
  $('cat').textContent=S.cur.c;
  $('eventText').textContent=S.cur.t;
  $('verdict').innerHTML='';
  $('guessBtn').textContent='Lock it in';
  $('guessBtn').className='btn';
  var start=1400+Math.floor(Math.random()*(2025-1400));
  $('slider').value=start;
  $('guessYear').textContent=start;
}
$('slider').oninput=function(){ $('guessYear').textContent=this.value; };
$('guessBtn').onclick=function(){
  if(!S.locked){
    S.locked=true;
    var guess=+$('slider').value;
    var pts=scoreGuess(S.cur.y,guess);
    S.total+=pts;
    $('total').textContent=S.total;
    var d=Math.abs(S.cur.y-guess);
    var line = d===0 ? 'Exact. Nailed it.' :
               d<=5 ? 'So close - off by '+d+'. The year:' :
               'Off by '+d+'. The year:';
    $('verdict').innerHTML='<span class="pts">+'+pts+'</span>'+line+' <b>'+S.cur.y+'</b>';
    $('guessBtn').textContent = (S.round===ROUNDS-1)?'See results':'Next event';
    $('guessBtn').className='btn ghost';
  } else {
    S.round++;
    if(S.round>=ROUNDS) finish();
    else nextEvent();
  }
};
function finish(){
  $('play').style.display='none';
  $('final').style.display='block';
  var nb='';
  if(S.total>best()){ saveBest(S.total); nb=' New best!'; }
  $('finalScore').textContent=S.total+' pts';
  $('finalGrade').textContent=grade(S.total,ROUNDS);
  $('finalBest').textContent='best: '+best()+nb;
  renderBest();
}
$('again').onclick=newRun;
function renderBest(){ $('best').textContent=best()?('best run: '+best()+' pts'):''; }
newRun();
</script>
</body>
</html>
